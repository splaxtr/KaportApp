name: backend-ci

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kaportapp_ci
          JWT_SECRET: testsecret
          JWT_REFRESH_SECRET: testrefresh
          PDF_BASE_URL: http://localhost:3000
          UPLOAD_DIR: ./uploads
        run: |
          sudo systemctl start postgresql || true
          psql -U postgres -c "CREATE DATABASE kaportapp_ci;" || true
          npm run test:e2e
